name: PR Agent (Gemini)
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "gemini/gemini-3.5-flash"
          config.fallback_models: '["gemini/gemini-3.6-flash", "gemini/gemini-3.7-flash", "gemini/gemini-3.8-flash"]'
          config.custom_model_max_tokens: "1048576"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Auto actions - improve disabled to save tokens on free tier
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          # Ignore non-essential files to save tokens
          ignore.glob: >-
            ['*.lock', '*.lockb',
            'package-lock.json', 'composer.lock', 'yarn.lock', 'pnpm-lock.yaml', 'bun.lockb',
            '*.md', '*.txt', '*.rst',
            '*.png', '*.jpg', '*.jpeg', '*.gif', '*.svg', '*.ico', '*.webp', '*.avif',
            '*.woff', '*.woff2', '*.ttf', '*.eot', '*.otf',
            '*.mp4', '*.webm', '*.ogg', '*.mp3', '*.wav',
            '*.pdf', '*.zip', '*.tar.gz',
            '*.min.js', '*.min.css', '*.map',
            'public/build/**', 'public/assets/**',
            'storage/**', '.github/**', '.vscode/**', '.idea/**']