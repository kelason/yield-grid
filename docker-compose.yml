version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yieldgrid
      POSTGRES_USER: yieldgrid
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yieldgrid-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - yieldgrid-network

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - yieldgrid-network

volumes:
  pgdata:

networks:
  yieldgrid-network:
    driver: bridge
